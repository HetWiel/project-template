# Bouwt het project bij elke push naar main, zet het image op GitHub (ghcr.io)
# en laat de server de nieuwe versie ophalen.
#
# Pas alleen PROJECT hieronder aan. Die naam moet gelijk zijn aan:
#   - de service-naam in /opt/hetwiel/docker-compose.yml
#   - het subdomein in de Caddyfile (bijv. mijnproject.hetwiel.dev)
#
# Benodigde secrets (zelfde als bij de hetwiel-repo):
#   SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY

name: Build en deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT: mijnproject   # ← alleen dit aanpassen

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.naam.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Imagenaam bepalen (moet in kleine letters)
        id: naam
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en uploaden
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.naam.outputs.image }}:latest
            ${{ steps.naam.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH-toegang instellen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Nieuwe versie ophalen en herstarten
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            cd /opt/hetwiel &&
            docker compose pull ${{ env.PROJECT }} &&
            docker compose up -d ${{ env.PROJECT }} &&
            docker image prune -f
          "
