# Builds the project on every push to main, puts the image on GitHub (ghcr.io)
# and has the server pull the new version.
#
# Only change PROJECT below. That name must match:
#   - the service name in /opt/hetwiel/docker-compose.yml
#   - the subdomain in the Caddyfile (e.g. myproject.hetwiel.dev)
#
# Required secrets (same as in the hetwiel repo):
#   SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT: myproject   # ← only change this

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    # Not in the template repo itself, only in projects created from it
    if: github.repository != 'HetWiel/project-template'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine image name (must be lowercase)
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull new version and restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            cd /opt/hetwiel &&
            docker compose pull ${{ env.PROJECT }} &&
            docker compose up -d ${{ env.PROJECT }} &&
            docker image prune -f
          "
